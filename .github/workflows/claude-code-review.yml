name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per pull request at a time. A push that updates a stack of pull
# requests can deliver the same event more than once, and a newer push makes an
# in-flight review of the old head pointless.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Workflows started by Dependabot get no repository secrets, and the action
    # refuses bot actors by default, so a review of a Dependabot pull request
    # could only fail.
    # Pull requests from forks could only fail too: their runs get no
    # repository secrets, and the action refuses actors without write access.
    # Skipping them shows outside contributions a skipped check instead of a
    # failed one. Collaborators get a review by opening the pull request from a
    # branch of this repository.
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    # A full review fans out to several subagents and takes minutes, not hours.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Actions are pinned to full commit SHAs, with the matching release in a
      # trailing comment. Whoever controls an action's repository can point a
      # tag at different code but cannot change what a SHA names, and this job
      # holds the Claude token and can request an OIDC token.
      # Dependabot proposes updates (.github/dependabot.yml).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          # The action ends the session at the first result message. Subagents
          # start in the background by default, so the review plugin's first
          # dispatch produced that result and the run ended before the review
          # (anthropics/claude-code-action#1499). Foreground subagents keep the
          # whole review inside one result.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The Bash rules repeat the review command's own allowed-tools as session
          # rules, which subagents inherit. A one-shot run is never woken up again,
          # so the tools for waiting on later events are removed.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --disallowedTools "ScheduleWakeup,Monitor,SendMessage"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action logs only counts, so a review that stopped early looks the same
      # as a clean one. Print what the run did, without any tool output.
      - name: Summarize the review run
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '
            (map(select(.type == "result")) | last) as $r
            | ($r.permission_denials // []) as $denied
            | "turns: \($r.num_turns // "none")",
              "subagents started: \([.[] | select(.type == "assistant" and .parent_tool_use_id == null)
                | .message.content[]? | select(.type == "tool_use" and (.name == "Agent" or .name == "Task"))] | length)",
              "denied tool calls: \($denied | length)",
              ($denied[] | "  \(.tool_name) \((.tool_input.command // "") | .[0:160])"),
              "final message: \(($r.result // "") | .[0:400])"
          ' "$EXECUTION_FILE"
